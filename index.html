<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081321"><title>JARVIS AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#15334a,#070d18 60%);color:#edf6ff;font:16px system-ui,Arial;min-height:100vh}header{position:sticky;top:0;background:#081321ed;border-bottom:1px solid #294057;padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:2}.logo{width:42px;height:42px;border:2px solid #5ee7ff;border-radius:50%;display:grid;place-items:center;color:#5ee7ff;font-size:25px}.brand{font-weight:900;letter-spacing:3px}.state{font-size:11px;color:#72e4ac;letter-spacing:1px;margin-left:auto}main{max-width:850px;margin:auto;padding:18px 16px 115px}.msg{padding:14px 16px;margin:12px 0;border:1px solid #2b4057;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.bot{background:#122033}.user{background:#173650;margin-left:auto;max-width:88%;width:max-content}.error{border-color:#b75e77;color:#ffc4d0}.composer{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#07111ff2;border-top:1px solid #293e54}.composer input{flex:1;min-width:0;background:#132238;border:1px solid #2b4057;border-radius:15px;padding:15px;color:white;font:inherit}.composer button{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(100deg,#5ee7ff,#9b8cff);font-weight:800;color:#07111f;font-size:16px}.hint{text-align:center;color:#8298b3;font-size:12px;margin-top:10px}button:disabled{opacity:.5}
</style></head><body>
<header><div class="logo">✧</div><div class="brand">JARVIS</div><div class="state" id="state">● ONLINE</div></header>
<main><div id="chat"><div class="msg bot">Halo! Saya JARVIS. Saya berjalan melalui server AI online. Tanyakan sesuatu!</div></div><div class="hint">JARVIS AI • Cloudflare Workers AI • Tidak perlu API key Gemini</div></main>
<div class="composer"><input id="prompt" placeholder="Tanyakan apa saja kepada JARVIS..." autocomplete="off"><button id="send">Kirim ↑</button></div>
<script>
const chat=document.getElementById('chat'),box=document.getElementById('prompt'),btn=document.getElementById('send'),state=document.getElementById('state');let history=[];
try{history=JSON.parse(localStorage.getItem('jarvis_v7_history')||'[]')}catch{history=[]}
for(const m of history)add(m.role,m.content);
function add(role,text){let d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');d.textContent=text;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}
async function send(){let text=box.value.trim();if(!text)return;box.value='';add('user',text);history.push({role:'user',content:text});let wait=add('assistant','JARVIS sedang berpikir…');btn.disabled=true;state.textContent='● BERPIKIR';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-12)})});let d=await r.json();if(!r.ok)throw Error(d.error||'Server error '+r.status);if(!d.response)throw Error('Model tidak mengirim jawaban.');wait.textContent=d.response;history.push({role:'assistant',content:d.response});history=history.slice(-24);localStorage.setItem('jarvis_v7_history',JSON.stringify(history));state.textContent='● ONLINE'}catch(e){wait.classList.add('error');wait.textContent='JARVIS belum bisa menjawab: '+e.message;state.textContent='● ERROR'}finally{btn.disabled=false;box.focus()}}
btn.onclick=send;box.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
